<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7efeb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Учет Студия">
  <meta name="format-detection" content="telephone=no">
  <title>Учет Студия</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./bk-icon-180.png?v=3">
  <link rel="icon" type="image/png" sizes="180x180" href="./bk-icon-180.png?v=3">
  <link rel="manifest" href="./manifest.webmanifest?v=3">
  <style>
    :root{color-scheme:light;--bg:#f7efeb;--card:rgba(255,255,255,.86);--ink:#2d2725;--muted:#8f827c;--accent:#9c705f;--line:#d9c4bb}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100svh;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 10%,rgba(255,255,255,.96),transparent 34%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    main{width:min(100%,420px);padding:32px 24px 26px;border:1px solid rgba(156,112,95,.22);border-radius:30px;background:var(--card);box-shadow:0 22px 60px rgba(73,48,40,.10);backdrop-filter:blur(16px)}
    .icon{width:132px;height:132px;display:block;margin:0 auto 22px;border-radius:28px;box-shadow:0 14px 32px rgba(73,48,40,.14)}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:500;letter-spacing:.02em}
    .subtitle{margin:8px 0 25px;color:var(--muted);font-size:16px;line-height:1.35}
    .button{width:100%;min-height:54px;display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;text-decoration:none;-webkit-tap-highlight-color:transparent}
    .hint{margin:19px 2px 0;color:var(--muted);font-size:14px;line-height:1.45}
    .standalone-note{display:none}
    @media(display-mode:standalone){.browser-note{display:none}.standalone-note{display:block}}
    @media(max-height:650px){main{padding-top:22px;padding-bottom:20px}.icon{width:104px;height:104px;margin-bottom:16px;border-radius:23px}h1{font-size:29px}.subtitle{margin-bottom:18px}}
  </style>
</head>
<body>
  <main>
    <img class="icon" src="./bk-icon-180.png?v=3" alt="Логотип Belyakova Keratin" width="180" height="180">
    <h1>Учет Студия</h1>
    <p class="subtitle">Belyakova Keratin</p>
    <a class="button" id="openApp" href="https://script.google.com/macros/s/AKfycbz91y2sOL4KIfI_VEivEqfvxCXYwV_GeWB3MWt9l65oDdTcFX1M87e6R5utcqnPwyalWA/exec?app=v12">Открыть приложение</a>
    <p class="hint browser-note">Добавьте эту страницу на экран «Домой». На ярлыке появится фирменный логотип BK.</p>
    <p class="hint standalone-note">Открываем приложение студии…</p>
  </main>
  <script>
    (function(){
      'use strict';
      var appUrl='https://script.google.com/macros/s/AKfycbz91y2sOL4KIfI_VEivEqfvxCXYwV_GeWB3MWt9l65oDdTcFX1M87e6R5utcqnPwyalWA/exec?app=v12';
      var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
      var button=document.getElementById('openApp');
      button.href=appUrl;
      button.addEventListener('click',function(event){event.preventDefault();window.location.assign(appUrl)});
      if(standalone){window.setTimeout(function(){window.location.replace(appUrl)},450)}
      if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
    })();
  </script>
</body>
</html>
