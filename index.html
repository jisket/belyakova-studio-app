<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7efeb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Учет Студия">
  <meta name="format-detection" content="telephone=no">
  <title>Учет Студия</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./bk-icon-180.png?v=5">
  <link rel="icon" type="image/png" sizes="180x180" href="./bk-icon-180.png?v=5">
  <link rel="manifest" href="./manifest.webmanifest?v=5">
  <style>
    :root{color-scheme:light;--bg:#f7efeb;--card:rgba(255,255,255,.88);--ink:#2d2725;--muted:#8f827c;--accent:#9c705f;--line:#d9c4bb}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .browser-shell{min-height:100%;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 10%,rgba(255,255,255,.96),transparent 34%),var(--bg);text-align:center}
    .browser-card{width:min(100%,420px);padding:32px 24px 26px;border:1px solid rgba(156,112,95,.22);border-radius:30px;background:var(--card);box-shadow:0 22px 60px rgba(73,48,40,.10);backdrop-filter:blur(16px)}
    .icon{width:132px;height:132px;display:block;margin:0 auto 22px;border-radius:28px;box-shadow:0 14px 32px rgba(73,48,40,.14)}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:500;letter-spacing:.02em}
    .subtitle{margin:8px 0 23px;color:var(--muted);font-size:16px;line-height:1.35}
    .button{width:100%;min-height:54px;display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;text-decoration:none;-webkit-tap-highlight-color:transparent}
    .hint{margin:18px 2px 0;color:var(--muted);font-size:14px;line-height:1.5}
    .paired{display:none;margin:15px 0 0;padding:11px 13px;border-radius:14px;background:#f0e6e0;color:#765445;font-size:13px;line-height:1.4}
    body[data-paired="1"] .paired{display:block}
    .launch-shell{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:radial-gradient(circle at 50% 18%,#fff,transparent 38%),var(--bg);text-align:center}
    .launch-mark{position:relative;width:92px;height:92px;display:grid;place-items:center;border:1px solid rgba(156,112,95,.28);border-radius:50%;background:#fffaf7;color:#865f50;font-family:Georgia,"Times New Roman",serif;font-size:31px;box-shadow:0 16px 38px rgba(73,48,40,.11);animation:bkPulse 1.25s ease-in-out infinite}
    .launch-mark::after{content:"";position:absolute;inset:-12px;border:1px solid rgba(156,112,95,.22);border-radius:50%;animation:bkRing 1.25s ease-out infinite}
    .launch-copy{margin-top:18px;color:var(--muted);font-size:14px;line-height:1.4}
    @keyframes bkPulse{0%,100%{transform:scale(.96);box-shadow:0 12px 30px rgba(73,48,40,.08)}50%{transform:scale(1.06);box-shadow:0 20px 48px rgba(73,48,40,.16)}}
    @keyframes bkRing{0%{opacity:.75;transform:scale(.82)}100%{opacity:0;transform:scale(1.28)}}
    @media(display-mode:standalone){.browser-shell{display:none}.launch-shell{display:grid}}
    @media(max-height:650px){.browser-card{padding-top:22px;padding-bottom:20px}.icon{width:104px;height:104px;margin-bottom:16px;border-radius:23px}h1{font-size:29px}.subtitle{margin-bottom:18px}}
    @media(prefers-reduced-motion:reduce){.launch-mark,.launch-mark::after{animation-duration:2.4s}}
  </style>
</head>
<body>
  <main class="browser-shell">
    <section class="browser-card">
      <img class="icon" src="./bk-icon-180.png?v=5" alt="Логотип Belyakova Keratin" width="180" height="180">
      <h1>Учет Студия</h1>
      <p class="subtitle">Belyakova Keratin</p>
      <a class="button" id="openApp" href="https://script.google.com/macros/s/AKfycbz91y2sOL4KIfI_VEivEqfvxCXYwV_GeWB3MWt9l65oDdTcFX1M87e6R5utcqnPwyalWA/exec?app=v12">Открыть приложение</a>
      <p class="paired">Доступ для этого iPhone сохранён. Теперь добавьте эту страницу на экран «Домой».</p>
      <p class="hint">В Safari нажмите «Поделиться» → «На экран Домой». После установки иконка будет сразу открывать обычную быструю версию приложения.</p>
    </section>
  </main>

  <section class="launch-shell" aria-label="Загрузка приложения">
    <div>
      <div class="launch-mark" aria-label="Загрузка">BK</div>
      <div class="launch-copy">Открываем приложение студии…</div>
    </div>
  </section>

  <script>
    (function(){
      'use strict';
      var appUrl='https://script.google.com/macros/s/AKfycbz91y2sOL4KIfI_VEivEqfvxCXYwV_GeWB3MWt9l65oDdTcFX1M87e6R5utcqnPwyalWA/exec?app=v12';
      var storageKey='bk_launcher_device_credential_v1';
      var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
      var button=document.getElementById('openApp');

      function normalize(value){
        var token=String(value||'').trim().replace(/^#/,'').toLowerCase();
        return /^(?:dl1|dv1)\.[a-f0-9]{64}$/.test(token)?token:'';
      }
      function cookieValue(){
        try{var match=document.cookie.match(/(?:^|; )bk_launcher_device_credential_v1=([^;]*)/);return match?decodeURIComponent(match[1]):''}catch(ignore){return''}
      }
      function readCredential(){
        var value='';
        try{value=String(localStorage.getItem(storageKey)||'')}catch(ignore){}
        return normalize(value)||normalize(cookieValue());
      }
      function saveCredential(value){
        var token=normalize(value);if(!token)return'';
        try{localStorage.setItem(storageKey,token)}catch(ignore){}
        try{document.cookie=storageKey+'='+encodeURIComponent(token)+'; Max-Age='+String(180*24*60*60)+'; Path=/; Secure; SameSite=Lax'}catch(ignoreCookie){}
        document.body.dataset.paired='1';
        return token;
      }
      function hashCredential(){
        var token=normalize(window.location.hash);if(!token)return'';
        token=saveCredential(token);
        try{history.replaceState(null,document.title,window.location.pathname+window.location.search)}catch(ignore){}
        return token;
      }
      function appLocation(credential){return appUrl+(credential?'#'+credential:'')}

      var credential=hashCredential()||readCredential();
      if(credential)document.body.dataset.paired='1';
      button.href=appLocation(credential);
      button.addEventListener('click',function(event){
        event.preventDefault();
        window.location.assign(appLocation(readCredential()||credential));
      });

      if(standalone){
        window.setTimeout(function(){
          window.location.replace(appLocation(readCredential()||credential));
        },180);
      }
      if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js?v=5').catch(function(){})})}
    })();
  </script>
</body>
</html>
